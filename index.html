<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Will You Be My Girlfriend? 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      text-align: center;
      width: 90%;
      max-width: 350px;
    }

    h1 {
      margin-top: 0;
    }

    p {
      font-size: 1.05rem;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    button {
      padding: 12px 22px;
      font-size: 1rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .yes {
      background: #ff5f9e;
      color: white;
    }

    .no {
      background: #e0e0e0;
      color: #333;
      position: relative;
    }

    .result {
      margin-top: 25px;
      font-size: 1.1rem;
      font-weight: bold;
      min-height: 1.4em;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Will you be my girlfriend? 💕</h1>
    <p>I really like you and want to be with you.<br>What’s your answer?</p>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes 💖</button>
      <button class="no" onmouseover="moveNo()">No 😳</button>
    </div>

    <div class="result" id="result"></div>
  </div>

  <script>
    function sayYes() {
      document.getElementById("result").textContent =
        "Yay! I’m so happy 💘";
    }

    function moveNo() {
      const btn = document.querySelector(".no");
      const x = Math.random() * 120 - 60;
      const y = Math.random() * 120 - 60;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>
</body>
</html>
